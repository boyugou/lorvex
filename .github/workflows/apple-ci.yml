name: Apple CI

# Automatic push/pull_request triggers are intentionally disabled: hosted macOS
# minutes are paused at the account level, so every auto-run only fails at the
# queue with a billing error. Local `apps/apple/script/verify_all.sh` runs the
# identical gate and is the validation of record while CI is paused. Re-enable
# the push/pull_request blocks (restoring the same `paths` filters) once hosted
# Actions billing is restored. Until then the job is manual-dispatch only.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  swift-package:
    name: Swift package
    runs-on: macos-15
    # verify_all.sh builds every product (app, mobile, watch, widgets,
    # MCP host), runs both test suites and every static verifier from a cold
    # checkout with no dependency cache, then stages the macOS app and audits the
    # packaged bundle (codesign/entitlements, Mach-O distribution + load closure,
    # verify_packaging.sh); the Release-link build below re-runs xcodegen
    # + a from-scratch xcodebuild. LORVEX_VERIFY_SKIP_PACKAGING=1 skips only the
    # GUI smoke launch and the real signing/notarize path, whose identities live
    # only on the owner's machine, so distribution is finalized locally, not in
    # CI. Budget generously.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # The runner ships several Xcode releases and defaults to an older one, so
      # every subsequent step runs against an explicitly chosen DEVELOPER_DIR.
      # App Store submissions require SDK 26 or later, which is also the app's
      # deployment floor; the newest installed release at or above that floor is
      # the right choice, and building against a newer SDK than the deployment
      # target is the intended configuration. The job hard-fails when the image
      # carries nothing recent enough, so a silent image change cannot quietly
      # drop below the submission SDK.
      - name: Select the submission toolchain (Xcode 26 or newer)
        run: |
          set -euo pipefail
          dev_dir=""
          for candidate in $(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V -r); do
            version="${candidate##*/Xcode_}"
            major="${version%%.*}"
            [[ "$major" =~ ^[0-9]+$ ]] || continue
            (( major >= 26 )) || continue
            if [[ -x "$candidate/Contents/Developer/usr/bin/xcodebuild" ]]; then
              dev_dir="$candidate/Contents/Developer"
              break
            fi
          done
          if [[ -z "$dev_dir" ]]; then
            echo "::error::No Xcode 26 or newer found under /Applications; cannot pin the submission toolchain." >&2
            ls -d /Applications/Xcode_*.app 2>/dev/null >&2 || true
            exit 1
          fi
          echo "Selected $dev_dir"
          echo "DEVELOPER_DIR=$dev_dir" >> "$GITHUB_ENV"
          sudo xcode-select -s "$dev_dir"
      # Record the selected toolchain and fail the job unless each of the three
      # submission platforms has an SDK at or above the floor. Checking every
      # platform separately matters: a single alternation over the SDK list
      # passes as soon as any one platform matches.
      - name: Toolchain evidence
        run: |
          set -euo pipefail
          xcodebuild -version
          sdks=$(xcodebuild -showsdks)
          printf '%s\n' "$sdks"
          require_sdk() {
            local label="$1" prefix="$2" version
            version=$(printf '%s\n' "$sdks" \
              | sed -n "s/.*-sdk ${prefix}\([0-9][0-9.]*\).*/\1/p" | sort -V | tail -1)
            if [[ -z "$version" ]]; then
              echo "::error::The selected toolchain installs no ${label} SDK." >&2
              exit 1
            fi
            if (( ${version%%.*} < 26 )); then
              echo "::error::${label} SDK ${version} is below the required 26." >&2
              exit 1
            fi
            echo "${label} SDK ${version}"
          }
          require_sdk macOS macosx
          require_sdk iOS iphoneos
          require_sdk watchOS watchos
      - name: Install XcodeGen
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: brew install xcodegen
      - name: Run Apple verification gate (no signing/notarize)
        working-directory: apps/apple
        env:
          LORVEX_VERIFY_SKIP_PACKAGING: "1"
        run: ./script/verify_all.sh
      - name: iOS Release link
        working-directory: apps/apple
        # Exit 78 is the verifier's soft-skip convention (no xcodegen/xcodebuild,
        # or the iOS platform SDK isn't installed on this runner) — treat it as
        # a skip, not a failure. Any other non-zero status is a real build/link
        # failure.
        run: |
          set +e
          ./script/verify_mobile_release_link.sh
          status=$?
          set -e
          if [[ "$status" -eq 78 ]]; then
            echo "::notice::iOS Release link skipped (environment unavailable on this runner)"
          elif [[ "$status" -ne 0 ]]; then
            exit "$status"
          fi
